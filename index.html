<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHGIndian - Card Generator</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- 1. Input Form Section -->
    <div class="form-container" id="form-section">
        <h2>Enter Card Details</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Photo Upload</label>
                <input type="file" id="in-photo" accept="image/*">
            </div>

            <div class="form-group">
                <label>Name (English)</label>
                <input type="text" id="in-name-en" placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label>Name (Hindi - Auto Generated)</label>
                <input type="text" id="in-name-hi" placeholder="पूरा नाम">
            </div>

            <div class="form-group">
                <label>Date of Birth (DD/MM/YYYY)</label>
                <input type="text" id="in-dob" placeholder="DD/MM/YYYY">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="in-gender">
                    <option value="पुरुष/Male">पुरुष/Male</option>
                    <option value="महिला/Female">महिला/Female</option>
                    <option value="अन्य/Transgender">अन्य/Transgender</option>
                </select>
            </div>

            <div class="form-group">
                <label>Card Number (12 Digits)</label>
                <input type="text" id="in-number" maxlength="14" placeholder="XXXX XXXX XXXX">
            </div>

            <div class="form-group full-width">
                <label>Address (English)</label>
                <textarea id="in-addr-en" rows="2" placeholder="S/O: Name, Flat/House No., Area, City, State - PIN"></textarea>
            </div>

            <div class="form-group full-width">
                <label>Address (Hindi - Auto Generated)</label>
                <textarea id="in-addr-hi" rows="2" placeholder="आत्मज: नाम, मकान नं., क्षेत्र, शहर, राज्य - पिन"></textarea>
            </div>
        </div>

        <button type="button" class="btn-primary" id="btn-generate">Generate Card</button>
    </div>

    <!-- 2. Controls when Card is visible -->
    <div class="action-bar no-print" id="action-bar" style="display: none;">
        <button class="btn-secondary" id="btn-edit">Edit Details</button>
        <button class="btn-success" id="btn-print">Print / Save as PDF</button>
    </div>

    <!-- 3. Generated Card Wrapper -->
    <div class="card-wrapper" id="card-wrapper" style="display: none;">
        <img src="final.jpg" alt="Aadhaar Template" class="template-bg">

        <div class="overlay-layer">
            <div class="user-photo-box">
                <img src="" id="disp-photo" alt="Photo">
            </div>

            <div class="user-details-box">
                <div class="name-hi" id="disp-name-hi"></div>
                <div class="name-en" id="disp-name-en"></div>
                <div class="detail-dob">जन्म तिथि/DOB:&nbsp; <span id="disp-dob"></span></div>
                <div class="detail-gender" id="disp-gender"></div>
            </div>

            <div class="aadhaar-number-box">
                <span id="disp-number"></span>
            </div>

            <div class="user-address-hi" id="disp-addr-hi"></div>
            <div class="user-address-en" id="disp-addr-en"></div>
        </div>
    </div>

</body>

</html>
